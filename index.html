<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learn_everything</title>
    <meta name="description" content="极简本地每日学习与课件生成系统，支持根据学习资料、目标与期限按日期规划并生成每日课程。" />
    <meta property="og:title" content="Learn_everything" />
    <meta property="og:description" content="极简本地每日学习与课件生成系统，支持根据学习资料、目标与期限按日期规划并生成每日课程。" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
  </head>
  <body class="bg-black text-neutral-100 antialiased selection:bg-neutral-800 selection:text-white">
    <div id="root"></div>
    <script>
      (function () {
        var shown = false;
        function showBootError(title, detail) {
          if (shown) return;
          var root = document.getElementById('root');
          if (root && root.childElementCount > 0) return;
          shown = true;
          var box = document.createElement('div');
          box.style.cssText =
            'position:fixed;inset:0;z-index:99999;background:#0a0a0a;color:#f5f5f5;padding:24px;font-family:monospace;font-size:13px;overflow:auto;line-height:1.6;';
          box.innerHTML =
            '<div style="max-width:680px;margin:0 auto;border:1px solid #3f3f46;border-radius:8px;padding:16px;background:#18181b;">' +
            '<div style="color:#f87171;font-weight:bold;margin-bottom:8px;">' +
            title +
            '</div>' +
            '<pre style="white-space:pre-wrap;word-break:break-word;color:#d4d4d8;margin:0;">' +
            String(detail || '')
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;') +
            '</pre></div>';
          document.body.appendChild(box);
        }
        window.addEventListener('error', function (e) {
          showBootError(
            '页面脚本加载或运行出错',
            (e.message || 'Unknown error') + (e.filename ? '\n@ ' + e.filename + ':' + e.lineno : '')
          );
        });
        window.addEventListener('unhandledrejection', function (e) {
          var reason = e.reason && (e.reason.stack || e.reason.message || String(e.reason));
          showBootError('页面异步加载出错', reason || 'Unhandled promise rejection');
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
